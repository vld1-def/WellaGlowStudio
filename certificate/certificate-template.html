<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Сертифікат — Wella Nails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 210mm; margin: 0; }
  :root{
    --gold:#d9bd8c; --gold-soft:#b89d6e; --ink:#f4f1ec; --muted:#c9c4bb;
    --bg1:#3a3a3d; --bg2:#26262a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh}
  .cert{
    position:relative;width:297mm;height:210mm;overflow:hidden;color:var(--ink);
    font-family:'Jost',sans-serif;
    background:radial-gradient(ellipse at 70% 40%,var(--bg1),var(--bg2) 75%);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  /* photo panel */
  .photo{position:absolute;left:0;top:0;bottom:0;width:36%;
    background:url('nails.jpg') center/cover no-repeat;}
  .photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.05) 55%,rgba(38,38,42,.55) 100%),
               linear-gradient(0deg,rgba(20,20,22,.55),transparent 30%);}
  .photo-edge{position:absolute;left:36%;top:0;bottom:0;width:1.2mm;
    background:linear-gradient(180deg,var(--gold),var(--gold-soft) 50%,var(--gold));}
  /* frame */
  .frame{position:absolute;left:calc(36% + 9mm);right:9mm;top:9mm;bottom:9mm;
    border:.35mm solid var(--gold-soft);}
  .frame::before{content:"";position:absolute;inset:1.6mm;border:.15mm solid rgba(217,189,140,.45);}
  .corner{position:absolute;width:6mm;height:6mm;border:.5mm solid var(--gold);}
  .c1{left:-.3mm;top:-.3mm;border-right:0;border-bottom:0}
  .c2{right:-.3mm;top:-.3mm;border-left:0;border-bottom:0}
  .c3{left:-.3mm;bottom:-.3mm;border-right:0;border-top:0}
  .c4{right:-.3mm;bottom:-.3mm;border-left:0;border-top:0}

  .content{position:absolute;left:calc(36% + 9mm);right:9mm;top:9mm;bottom:9mm;
    display:flex;flex-direction:column;align-items:center;text-align:center;padding:11mm 14mm 10mm;}
  .brand{font-weight:300;font-size:3.1mm;letter-spacing:1.6mm;color:var(--gold);text-transform:uppercase}
  h1{font-weight:200;font-size:15.5mm;letter-spacing:3.2mm;margin:6mm 0 0 3.2mm;line-height:1;color:#fff}
  .ornament{display:flex;align-items:center;gap:3mm;margin:8mm 0 7mm;color:var(--gold)}
  .ornament i{display:block;flex:none;width:26mm;height:.4mm;background:linear-gradient(90deg,transparent,var(--gold))}
  .ornament i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
  .ornament b{display:block;width:2mm;height:2mm;transform:rotate(45deg);border:.3mm solid var(--gold)}
  .sub{font-size:4.6mm;font-weight:300;letter-spacing:.9mm;text-transform:uppercase;line-height:1.55;color:var(--ink)}
  .certify{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:6.8mm;color:var(--muted);margin-top:13mm}
  .name{margin-top:5mm;min-width:150mm;border-bottom:.3mm solid var(--gold);
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:11.5mm;letter-spacing:.4mm;
    color:#fff;padding:0 6mm 1.2mm;min-height:15mm;line-height:1.2;outline:none}
  .name:empty::before{content:"\00a0"}
  .text{margin-top:10mm;font-size:5mm;font-weight:300;line-height:1.7;letter-spacing:.4mm;color:var(--ink)}
  .text strong{font-weight:500;color:var(--gold)}
  .footer{margin-top:auto;width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4mm}
  .field{width:62mm;text-align:left}
  .field.right{text-align:right}
  .field .val{font-family:'Cormorant Garamond',serif;font-size:5.2mm;min-height:7mm;
    border-bottom:.25mm solid var(--gold-soft);padding-bottom:.8mm;outline:none;color:#fff}
  .field .val.sig{font-style:italic}
  .field .lbl{margin-top:1.6mm;font-size:2.7mm;letter-spacing:.9mm;text-transform:uppercase;color:var(--muted);font-weight:300}
  /* seal */
  .seal{width:27mm;height:27mm;position:relative;margin-bottom:-2mm}
  .seal svg{width:100%;height:100%}
  @media screen{ .cert{box-shadow:0 10px 50px rgba(0,0,0,.6);transform-origin:center;} }
  @media print{ .cert{transform:none!important} html,body{background:none} body{display:block;min-height:0} }
</style>
</head>
<body>
<div class="cert">
  <div class="photo"></div><div class="photo-edge"></div>
  <div class="frame"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span></div>

  <div class="content">
    <div class="brand">Wella Nails · Studio</div>
    <h1>CERTIFICATE</h1>
    <div class="ornament"><i></i><b></b><i></i></div>
    <div class="sub">підвищення кваліфікації<br>майстра манікюру</div>

    <div class="certify">Підтверджує, що</div>
    <div class="name" id="name" contenteditable="true" spellcheck="false"></div>

    <div class="text">успішно закінчила курс<br><strong>підвищення кваліфікації</strong></div>

    <div class="footer">
      <div class="field">
        <div class="val" id="teacher">wella_nails_if</div>
        <div class="lbl">Викладач</div>
      </div>
      <div class="seal">
        <svg viewBox="0 0 120 120">
          <defs><path id="c" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
          <circle cx="60" cy="60" r="57" fill="none" stroke="#d9bd8c" stroke-width="1.2"/>
          <circle cx="60" cy="60" r="53" fill="none" stroke="#d9bd8c" stroke-width=".4"/>
          <circle cx="60" cy="60" r="31" fill="none" stroke="#d9bd8c" stroke-width=".6"/>
          <text font-family="Jost" font-size="8.2" letter-spacing="3.1" fill="#d9bd8c" font-weight="400"><textPath href="#c" startOffset="0">WELLA NAILS ✦ PROFESSIONAL COURSE ✦</textPath></text>
          <text x="60" y="68" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-size="26" fill="#d9bd8c">W</text>
        </svg>
      </div>
      <div class="field right">
        <div class="val" id="date" contenteditable="true" spellcheck="false">&nbsp;</div>
        <div class="lbl">Дата</div>
      </div>
    </div>
  </div>
</div>
<script>
  // Ім'я та дату можна передати в посиланні: certificate.html?name=Ім'я Прізвище&date=13.10.2026
  const q=new URLSearchParams(location.search);
  if(q.get('name')) document.getElementById('name').textContent=q.get('name');
  if(q.get('date')) document.getElementById('date').textContent=q.get('date');
  if(q.get('teacher')) document.getElementById('teacher').textContent=q.get('teacher');
  // масштаб для перегляду на екрані
  function fit(){const c=document.querySelector('.cert');if(matchMedia('print').matches)return;
    const s=Math.min(1,(innerWidth-20)/c.offsetWidth,(innerHeight-20)/c.offsetHeight);
    c.style.transform='scale('+s+')';document.body.style.height=(c.offsetHeight*s+20)+'px';}
  addEventListener('resize',fit);addEventListener('load',fit);
</script>
</body>
</html>
